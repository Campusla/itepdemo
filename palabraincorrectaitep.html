<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Palabra Incorrecta - iTEP Oficial</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #4a90e2; /* Azul sólido característico del branding */
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .top-instruction {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            padding: 25px 20px 5px 20px;
            letter-spacing: 0.3px;
        }
        .top-instruction span {
            color: #f59e0b; /* Amarillo oficial para resaltar */
            text-decoration: underline;
        }
        .main-content {
            width: 100%;
            max-width: 850px;
            padding: 15px 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .question-statement {
            font-size: 21px;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #ffffff;
        }
        .question-statement u {
            text-decoration: underline;
            font-weight: 700;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #ffffff;
            color: #1e293b;
            border: none;
            border-radius: 40px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .option-btn.correct {
            background: #10b981 !important;
            color: #ffffff !important;
            border: 2px solid #059669;
        }
        .option-btn.incorrect {
            background: #ef4444 !important;
            color: #ffffff !important;
            border: 2px solid #dc2626;
        }
        .feedback-box {
            font-size: 16px;
            font-weight: 600;
            min-height: 28px;
            margin-bottom: 10px;
            padding: 6px;
            border-radius: 6px;
        }
        .footer-nav {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .counter-section {
            font-size: 22px;
            font-weight: 700;
        }
        .counter-section span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            opacity: 0.8;
            text-transform: uppercase;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.5);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .dashboard-btn-container {
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-tablero {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .btn-tablero:hover {
            background: #1d4ed8;
        }
        .copyright {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Instrucción superior con branding exacto -->
    <div class="top-instruction">
        Select the answer that <span>INCORRECTLY</span> completes or contains an error in the sentence.
    </div>

    <!-- Contenido principal interactivo -->
    <div class="main-content">
        <div id="questionContainer">
            <!-- Se inyecta dinámicamente vía JavaScript para las 30 preguntas -->
        </div>
        <div class="feedback-box" id="feedbackMessage"></div>
    </div>

    <!-- Barra de navegación inferior -->
    <div class="footer-nav">
        <div class="counter-section">
            <span id="currentIndexLabel">1/30</span>
            <span style="font-size: 10px;">Question</span>
        </div>
        
        <div class="section-title">Palabra Incorrecta Section</div>

        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" onclick="changeQuestion(-1)" disabled>Back</button>
            <button class="nav-btn" id="nextBtn" onclick="changeQuestion(1)">Next</button>
        </div>
    </div>

    <div class="dashboard-btn-container">
        <a href="index.html" class="btn-tablero">🏠 Regresar al Tablero de Sections</a>
        <div class="copyright">Copyright © 2026 iTEP International, LLC. All Rights Reserved.</div>
    </div>

    <script>
        const questionsData = [
            { text: "She goes <u>(A)</u> to the store yesterday <u>(B)</u> because she needs <u>(C)</u> fresh fruit <u>(D)</u>.", options: ["A) goes", "B) yesterday", "C) needs", "D) fresh fruit"], correctIndex: 0 },
            { text: "Neither the teacher nor the students <u>(A)</u> was present <u>(B)</u> at the meeting held <u>(C)</u> this morning <u>(D)</u>.", options: ["A) was", "B) present", "C) held", "D) morning"], correctIndex: 0 },
            { text: "If he would have <u>(A)</u> known about the traffic, he <u>(B)</u> would have taken another <u>(C)</u> route home <u>(D)</u>.", options: ["A) would have", "B) he", "C) another", "D) route home"], correctIndex: 0 },
            { text: "Each <u>(A)</u> of the participants are <u>(B)</u> required to submit their <u>(C)</u> report by Friday afternoon <u>(D)</u>.", options: ["A) Each", "B) are", "C) their", "D) afternoon"], correctIndex: 1 },
            { text: "She is one <u>(A)</u> of those people who always <u>(B)</u> complains <u>(C)</u> about the weather <u>(D)</u>.", options: ["A) one", "B) always", "C) complains", "D) weather"], correctIndex: 2 },
            { text: "The manager asked <u>(A)</u> me where <u>(B)</u> did I put the <u>(C)</u> financial records <u>(D)</u>.", options: ["A) asked", "B) where", "C) did I put", "D) records"], correctIndex: 2 },
            { text: "Despite <u>(A)</u> of the heavy rain, they <u>(B)</u> decided to continue the <u>(C)</u> outdoor match <u>(D)</u>.", options: ["A) Despite", "B) they", "C) continue", "D) outdoor"], correctIndex: 0 },
            { text: "He has <u>(A)</u> lived in this town since <u>(B)</u> ten <u>(C)</u> years ago <u>(D)</u>.", options: ["A) has", "B) since", "C) ten", "D) years ago"], correctIndex: 1 },
            { text: "By the time <u>(A)</u> she arrived at the station, <u>(B)</u> the train already <u>(C)</u> left <u>(D)</u>.", options: ["A) By the time", "B) arrived", "C) already", "D) left"], correctIndex: 2 },
            { text: "It is <u>(A)</u> important that every employee <u>(B)</u> submit <u>(C)</u> his report on time <u>(D)</u>.", options: ["A) It is", "B) employee", "C) submit", "D) on time"], correctIndex: 2 },
            { text: "Hardly had <u>(A)</u> she entered the office <u>(B)</u> when the phone <u>(C)</u> starts <u>(D)</u> ringing.", options: ["A) Hardly had", "B) entered", "C) phone", "D) starts"], correctIndex: 3 },
            { text: "The new software <u>(A)</u> is designed <u>(B)</u> to optimize <u>(C)</u> user data secure <u>(D)</u>.", options: ["A) software", "B) designed", "C) optimize", "D) secure"], correctIndex: 3 },
            { text: "Not only <u>(A)</u> was the presentation clear, <u>(B)</u> but it was also <u>(C)</u> highly inspire <u>(D)</u>.", options: ["A) Not only", "B) clear", "C) also", "D) inspire"], correctIndex: 3 },
            { text: "Unless <u>(A)</u> you study hard <u>(B)</u> for the exam, you <u>(C)</u> will pass <u>(D)</u>.", options: ["A) Unless", "B) study hard", "C) you", "D) will pass"], correctIndex: 3 },
            { text: "The number <u>(A)</u> of applications received <u>(B)</u> this month <u>(C)</u> have increased <u>(D)</u>.", options: ["A) number", "B) received", "C) month", "D) have increased"], correctIndex: 3 },
            { text: "She suggested <u>(A)</u> that we to postpone <u>(B)</u> the meeting until <u>(C)</u> next week <u>(D)</u>.", options: ["A) suggested", "B) to postpone", "C) until", "D) next week"], correctIndex: 1 },
            { text: "Walking <u>(A)</u> through the park, <u>(B)</u> a stray dog <u>(C)</u> barked loudly <u>(D)</u>.", options: ["A) Walking", "B) park", "C) stray dog", "D) barked"], correctIndex: 0 },
            { text: "He speaks <u>(A)</u> English much more <u>(B)</u> fluent <u>(C)</u> than his brother <u>(D)</u>.", options: ["A) speaks", "B) more", "C) fluent", "D) brother"], correctIndex: 2 },
            { text: "The instructions <u>(A)</u> provided in the manual <u>(B)</u> are extremely <u>(C)</u> confusingly <u>(D)</u>.", options: ["A) instructions", "B) manual", "C) extremely", "D) confusingly"], correctIndex: 3 },
            { text: "Supposing <u>(A)</u> that it rains <u>(B)</u> tomorrow, what <u>(C)</u> we will do <u>(D)</u>?", options: ["A) Supposing", "B) rains", "C) what", "D) we will do"], correctIndex: 3 },
            { text: "She is <u>(A)</u> looking forward to meet <u>(B)</u> the new director <u>(C)</u> next Monday <u>(D)</u>.", options: ["A) looking", "B) to meet", "C) director", "D) Monday"], correctIndex: 1 },
            { text: "Little <u>(A)</u> did he knew <u>(B)</u> about the surprise <u>(C)</u> prepared for him <u>(D)</u>.", options: ["A) Little", "B) did he knew", "C) surprise", "D) prepared"], correctIndex: 1 },
            { text: "The information <u>(A)</u> shared during <u>(B)</u> the workshop were <u>(C)</u> very useful <u>(D)</u>.", options: ["A) information", "B) shared", "C) were", "D) useful"], correctIndex: 2 },
            { text: "Neither of the candidates <u>(A)</u> have <u>(B)</u> submitted their <u>(C)</u> resume yet <u>(D)</u>.", options: ["A) candidates", "B) have", "C) their", "D) yet"], correctIndex: 1 },
            { text: "It was <u>(A)</u> such a cold day <u>(B)</u> that everyone stay <u>(C)</u> indoors <u>(D)</u>.", options: ["A) such", "B) cold day", "C) stay", "D) indoors"], correctIndex: 2 },
            { text: "Despite of <u>(A)</u> her efforts, she <u>(B)</u> could not secure <u>(C)</u> the contract <u>(D)</u>.", options: ["A) Despite of", "B) efforts", "C) secure", "D) contract"], correctIndex: 0 },
            { text: "The building <u>(A)</u> was damaged severely <u>(B)</u> during last night's <u>(C)</u> storm <u>(D)</u>.", options: ["A) building", "B) damaged severely", "C) night's", "D) storm"], correctIndex: 1 },
            { text: "She acts <u>(A)</u> as if she is <u>(B)</u> the owner <u>(C)</u> of the company <u>(D)</u>.", options: ["A) acts", "B) is", "C) owner", "D) company"], correctIndex: 1 },
            { text: "He is <u>(A)</u> used to work <u>(B)</u> under pressure <u>(C)</u> and tight deadlines <u>(D)</u>.", options: ["A) used", "B) to work", "C) pressure", "D) deadlines"], correctIndex: 1 },
            { text: "All <u>(A)</u> the furniture were <u>(B)</u> moved into <u>(C)</u> the new office <u>(D)</u>.", options: ["A) All", "B) were", "C) moved into", "D) office"], correctIndex: 1 }
        ];

        let currentIdx = 0;
        let answeredState = {};

        function renderCurrentQuestion() {
            const container = document.getElementById('questionContainer');
            const q = questionsData[currentIdx];
            const feedbackEl = document.getElementById('feedbackMessage');

            let html = `
                <div class="question-statement">${currentIdx + 1}. ${q.text}</div>
                <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                let btnClass = "option-btn";
                if (answeredState[currentIdx] !== undefined) {
                    if (idx === q.correctIndex) {
                        btnClass += " correct";
                    } else if (idx === answeredState[currentIdx]) {
                        btnClass += " incorrect";
                    }
                }
                html += `
                    <button class="${btnClass}" onclick="checkAnswer(${idx}, this)">
                        ${opt}
                    </button>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;

            if (answeredState[currentIdx] !== undefined) {
                if (answeredState[currentIdx] === q.correctIndex) {
                    feedbackEl.innerText = "✅ ¡Correcto! Has seleccionado la opción con el error.";
                    feedbackEl.style.color = "#d1fae5";
                } else {
                    feedbackEl.innerText = "❌ Incorrecto. Esa opción es válida; la señalada en verde contiene el error.";
                    feedbackEl.style.color = "#fee2e2";
                }
            } else {
                feedbackEl.innerText = "";
            }

            document.getElementById('currentIndexLabel').innerText = `${currentIdx + 1}/30`;
            document.getElementById('prevBtn').disabled = (currentIdx === 0);
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentIdx === questionsData.length - 1) {
                nextBtn.innerText = "Finish";
                nextBtn.setAttribute('onclick', 'finishTest()');
            } else {
                nextBtn.innerText = "Next";
                nextBtn.setAttribute('onclick', 'changeQuestion(1)');
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (answeredState[currentIdx] !== undefined) return; // Ya respondió esta
            
            answeredState[currentIdx] = selectedIndex;
            const q = questionsData[currentIdx];
            const buttons = document.querySelectorAll('.option-btn');
            const feedbackEl = document.getElementById('feedbackMessage');

            buttons.forEach((btn, idx) => {
                if (idx === q.correctIndex) {
                    btn.classList.add('correct');
                } else if (idx === selectedIndex) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedIndex === q.correctIndex) {
                feedbackEl.innerText = "✅ ¡Correcto! Has seleccionado la opción con el error.";
                feedbackEl.style.color = "#d1fae5";
            } else {
                feedbackEl.innerText = "❌ Incorrecto. Esa opción es válida; la señalada en verde contiene el error.";
                feedbackEl.style.color = "#fee2e2";
            }
        }

        function changeQuestion(direction) {
            currentIdx += direction;
            if (currentIdx < 0) currentIdx = 0;
            if (currentIdx >= questionsData.length) currentIdx = questionsData.length - 1;
            renderCurrentQuestion();
        }

        function finishTest() {
            alert('¡Módulo de Palabra Incorrecta finalizado y guardado con éxito!');
            window.location.href = 'index.html';
        }

        window.onload = renderCurrentQuestion;
    </script>
</body>
</html>
